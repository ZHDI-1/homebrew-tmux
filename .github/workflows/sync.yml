name: Sync tmux io256 formula
on:
  workflow_dispatch:
  schedule:
    - cron: '29 * * * *'

permissions:
  contents: write

concurrency:
  group: tmux-io256-formula
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'ZHDI-1/homebrew-tmux' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      updated: ${{ steps.sync.outputs.updated }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Sync the published formula
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ZHDI-1/tmux
        shell: bash
        run: |
          if ! gh api "repos/$SOURCE_REPO/releases/latest" > "$RUNNER_TEMP/release.json"; then
            echo "::error::Could not read the latest io256 release"
            exit 1
          fi
          tag=$(jq -er '.tag_name' "$RUNNER_TEMP/release.json")
          [[ $tag =~ ^v[0-9]+(\.[0-9]+)+-io256\.[1-9][0-9]*$ ]]
          gh release download "$tag" --repo "$SOURCE_REPO" --dir "$RUNNER_TEMP" --pattern tmux.rb --pattern SHA256SUMS
          (cd "$RUNNER_TEMP"; awk '$2 == "tmux.rb" { print }' SHA256SUMS | sha256sum --check --strict)
          ruby -c "$RUNNER_TEMP/tmux.rb"
          mkdir -p Formula
          cp "$RUNNER_TEMP/tmux.rb" Formula/
          git rm --ignore-unmatch Formula/tmux-io256.rb
          git add Formula/tmux.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Update tmux to $tag"
          git push
          echo "updated=true" >> "$GITHUB_OUTPUT"

  install:
    needs: sync
    if: needs.sync.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    timeout-minutes: 20
    steps:
      - name: Install and test the tap formula
        run: |
          if [[ -n "$(brew list --formula --versions tmux)" ]]; then
            brew uninstall tmux
          fi
          brew install ZHDI-1/tmux/tmux
          brew test ZHDI-1/tmux/tmux
          test "$(command -v tmux)" = "$(brew --prefix)/bin/tmux"
          test "$(tmux -V)" = "$("$(brew --prefix ZHDI-1/tmux/tmux)/bin/tmux" -V)"
